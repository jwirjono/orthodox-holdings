<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Baseline head for crawlers that never run JavaScript. The description,
         canonical, hreflang set, Open Graph tags and JSON-LD graph are injected
         at build time by the `orthodox-seo-assets` plugin in vite.config.ts;
         SeoHead then rewrites them in place when the visitor switches language. -->
    <title>Orthodox Holding | Integrated Business &amp; Wealth Advisory</title>
    <meta name="author" content="Orthodox Holding">
    <meta name="application-name" content="Orthodox Holding">
    <meta name="apple-mobile-web-app-title" content="Orthodox Holding">
    <!-- Matches the site ground colour so mobile browser chrome does not flash white. -->
    <meta name="theme-color" content="#0A0A0A">
    <!-- Favicon set generated from src/assets/images/favicon/favicon.png (trimmed to content) -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-dark-96x96.png" media="(prefers-color-scheme: dark)">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Montserrat v9.000 (Julieta Ulanovsky) — variable font, wght 100..900, upright + italic -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#0A0A0A] text-[#F5F5F5] antialiased selection:bg-white selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
